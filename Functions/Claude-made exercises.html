<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Functions Quest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg:        #0b0f1a;
    --panel:     #111827;
    --border:    #1e2d40;
    --accent:    #00e5ff;
    --accent2:   #7c3aed;
    --gold:      #f59e0b;
    --green:     #10b981;
    --red:       #ef4444;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --mono:      'Share Tech Mono', monospace;
    --sans:      'Rajdhani', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 900px;
    padding: 32px 24px 0;
    text-align: center;
  }

  .game-title {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 28px rgba(0,229,255,.4);
    line-height: 1.1;
  }

  .game-sub {
    font-family: var(--mono);
    font-size: .82rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: .08em;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    width: 100%;
    max-width: 900px;
    padding: 24px 24px 0;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width .5s ease;
    width: 0%;
  }

  /* ── XP BADGES ── */
  .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
    padding: 0 24px;
  }

  .badge {
    font-family: var(--mono);
    font-size: .68rem;
    padding: 3px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all .3s;
  }
  .badge.unlocked {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px rgba(0,229,255,.25);
  }
  .badge.unlocked.gold {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 10px rgba(245,158,11,.25);
  }

  /* ── MAIN CONTENT ── */
  main {
    width: 100%;
    max-width: 900px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── EXERCISE CARD ── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .card.active   { border-color: var(--accent); }
  .card.solved   { border-color: var(--green);  }
  .card.locked   { opacity: .45; pointer-events: none; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }

  .card-num {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--accent);
    min-width: 28px;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .04em;
    flex: 1;
  }

  .card-tags {
    display: flex;
    gap: 6px;
  }

  .tag {
    font-family: var(--mono);
    font-size: .6rem;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .tag.recursive { background: rgba(124,58,237,.25); color: #a78bfa; border: 1px solid rgba(124,58,237,.4); }
  .tag.function  { background: rgba(0,229,255,.12);  color: var(--accent); border: 1px solid rgba(0,229,255,.3); }

  .diff-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .diff-1 { background: var(--green); }
  .diff-2 { background: #22d3ee; }
  .diff-3 { background: var(--gold); }
  .diff-4 { background: #f97316; }
  .diff-5 { background: var(--red); }

  .card-chevron {
    font-size: .8rem;
    color: var(--muted);
    transition: transform .25s;
  }
  .card.open .card-chevron { transform: rotate(90deg); }

  .card-body {
    display: none;
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
  }
  .card.open .card-body { display: block; }

  .desc {
    font-size: .95rem;
    color: #94a3b8;
    line-height: 1.65;
    margin-top: 14px;
  }

  /* JS-specific callouts */
  .js-note {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(124,58,237,.12);
    border-left: 3px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    font-family: var(--mono);
    font-size: .78rem;
    color: #c4b5fd;
    line-height: 1.55;
  }
  .js-note strong { color: #a78bfa; }

  /* Code editor area */
  .editor-label {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--muted);
    margin-top: 16px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  .editor {
    width: 100%;
    background: #060b14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #e2e8f0;
    font-family: var(--mono);
    font-size: .84rem;
    line-height: 1.6;
    padding: 14px;
    resize: vertical;
    min-height: 130px;
    outline: none;
    tab-size: 2;
    transition: border-color .2s;
    caret-color: var(--accent);
  }
  .editor:focus { border-color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: .88rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all .15s;
  }

  .btn-run {
    background: var(--accent);
    color: #0b0f1a;
  }
  .btn-run:hover { box-shadow: 0 0 16px rgba(0,229,255,.5); }

  .btn-hint {
    background: transparent;
    border: 1px solid var(--accent2);
    color: #a78bfa;
  }
  .btn-hint:hover { background: rgba(124,58,237,.15); }

  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-reset:hover { border-color: var(--muted); color: var(--text); }

  /* Output pane */
  .output {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: .82rem;
    line-height: 1.6;
    display: none;
  }
  .output.pass {
    display: block;
    background: rgba(16,185,129,.1);
    border: 1px solid rgba(16,185,129,.3);
    color: var(--green);
  }
  .output.fail {
    display: block;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
  }
  .output.info {
    display: block;
    background: rgba(0,229,255,.08);
    border: 1px solid rgba(0,229,255,.2);
    color: var(--accent);
  }

  /* Hint box */
  .hint-box {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(245,158,11,.08);
    border: 1px solid rgba(245,158,11,.3);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: .78rem;
    color: #fde68a;
    line-height: 1.55;
  }
  .hint-box.show { display: block; }

  /* Status icon on solved */
  .status-icon { display: none; }
  .card.solved .status-icon { display: inline; color: var(--green); margin-left: 6px; }

  /* ── FOOTER XP ── */
  .xp-bar {
    width: 100%;
    max-width: 900px;
    padding: 0 24px 40px;
    text-align: center;
  }
  .xp-total {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245,158,11,.4);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  /* Celebration flash */
  @keyframes flash {
    0%   { box-shadow: 0 0 0px var(--green); }
    50%  { box-shadow: 0 0 32px var(--green); }
    100% { box-shadow: 0 0 0px var(--green); }
  }
  .card.just-solved { animation: flash .6s ease; }
</style>
</head>
<body>

<header>
  <div class="game-title">JS Functions Quest</div>
  <div class="game-sub">// 10 challenges · functions & recursion · Java dev edition</div>
</header>

<div class="progress-wrap">
  <div class="progress-meta">
    <span id="prog-label">0 / 10 solved</span>
    <span id="xp-label">0 XP</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
</div>

<div class="badges">
  <div class="badge" id="b1">🔓 First Blood</div>
  <div class="badge" id="b3">⚡ Halfway</div>
  <div class="badge" id="b5">🌀 Recursion Apprentice</div>
  <div class="badge" id="b10" style="--accent:var(--gold)">👑 Quest Complete</div>
</div>

<main id="main"></main>

<div class="xp-bar">
  <div class="xp-total" id="xp-total">— earn XP by solving challenges —</div>
</div>

<script>
/* ── EXERCISE DATA ── */
const exercises = [
  {
    id: 1, diff: 1,
    title: "Arrow Functions & Default Params",
    tags: ["function"],
    xp: 50,
    desc: `Write a function <code>greet(name, greeting = "Hello")</code> using an arrow function expression stored in a <code>const</code>. It should return the string <code>"Hello, World!"</code> (or whatever name/greeting is passed).<br><br>In Java you'd use method overloading for defaults. JS has native default parameters.`,
    jsNote: `<strong>JS twist:</strong> Arrow functions have no own <code>this</code>, no <code>arguments</code> object, and can't be used as constructors. Also, <code>function</code> declarations are hoisted — arrow functions stored in <code>const</code> are <em>not</em>.`,
    hint: `const greet = (name, greeting = "Hello") => \`\${greeting}, \${name}!\`;`,
    starter: `const greet = /* your arrow function here */;\n\n// Tests run automatically when you click Run`,
    tests: (fn) => {
      const r1 = fn("World");
      const r2 = fn("Ada", "Hi");
      const r3 = fn("Bob", "Hey");
      if (r1 !== "Hello, World!") return `Expected "Hello, World!" but got "${r1}"`;
      if (r2 !== "Hi, Ada!")      return `Expected "Hi, Ada!" but got "${r2}"`;
      if (r3 !== "Hey, Bob!")     return `Expected "Hey, Bob!" but got "${r3}"`;
      return true;
    }
  },
  {
    id: 2, diff: 1,
    title: "Higher-Order Functions: map & filter",
    tags: ["function"],
    xp: 80,
    desc: `Write a function <code>evenSquares(arr)</code> that takes an array of numbers, keeps only the even ones, and returns their squares.<br><br>Use <code>Array.prototype.filter</code> and <code>Array.prototype.map</code> — <em>no loops allowed</em>.`,
    jsNote: `<strong>JS twist:</strong> In Java you'd reach for streams. In JS, arrays have <code>.filter()</code>, <code>.map()</code>, <code>.reduce()</code> built in. They all take callback functions — first-class citizens here.`,
    hint: `return arr.filter(n => n % 2 === 0).map(n => n * n);`,
    starter: `function evenSquares(arr) {\n  // no loops!\n}`,
    tests: (fn) => {
      const r1 = JSON.stringify(fn([1,2,3,4,5,6]));
      const r2 = JSON.stringify(fn([7,8,9,10]));
      const r3 = JSON.stringify(fn([1,3,5]));
      if (r1 !== "[4,16,36]")  return `evenSquares([1..6]) → expected [4,16,36], got ${r1}`;
      if (r2 !== "[64,100]")   return `evenSquares([7..10]) → expected [64,100], got ${r2}`;
      if (r3 !== "[]")         return `evenSquares([1,3,5]) → expected [], got ${r3}`;
      return true;
    }
  },
  {
    id: 3, diff: 2,
    title: "Closures as Private State",
    tags: ["function"],
    xp: 110,
    desc: `Write a function <code>makeCounter(start = 0)</code> that returns an <strong>object</strong> with three methods: <code>increment()</code>, <code>decrement()</code>, and <code>value()</code>. The counter state must live in a closure — no class, no <code>this</code>.`,
    jsNote: `<strong>JS twist:</strong> Java uses classes for encapsulation. JS closures let a function "remember" its surrounding scope — the inner functions share the same <code>count</code> variable, invisible to the outside.`,
    hint: `function makeCounter(start = 0) {\n  let count = start;\n  return {\n    increment: () => ++count,\n    decrement: () => --count,\n    value: () => count\n  };\n}`,
    starter: `function makeCounter(start = 0) {\n  // your closure here\n}`,
    tests: (fn) => {
      const c = fn(5);
      c.increment(); c.increment(); c.decrement();
      if (c.value() !== 6) return `Expected 6 after +1+1-1 from 5, got ${c.value()}`;
      const d = fn();
      d.increment();
      if (d.value() !== 1) return `Default start=0: expected 1 after increment, got ${d.value()}`;
      return true;
    }
  },
  {
    id: 4, diff: 2,
    title: "Currying & Partial Application",
    tags: ["function"],
    xp: 130,
    desc: `Write a function <code>multiply(a)</code> that returns a function which multiplies its argument by <code>a</code>.<br>Then create <code>triple</code> and <code>quadruple</code> using <code>multiply</code>.`,
    jsNote: `<strong>JS twist:</strong> Java doesn't support currying natively. In JS, functions can return functions. This is how libraries like Ramda/lodash curry everything. It's also the basis of React's <code>useCallback</code> patterns.`,
    hint: `const multiply = a => b => a * b;\nconst triple = multiply(3);\nconst quadruple = multiply(4);`,
    starter: `const multiply = /* return a function */;\n\nconst triple = /* use multiply */;\nconst quadruple = /* use multiply */;`,
    tests: () => {
      // evaluated differently — see runner
      return "__curry__";
    }
  },
  {
    id: 5, diff: 3,
    title: "Function Composition",
    tags: ["function"],
    xp: 150,
    desc: `Write a function <code>compose(...fns)</code> that takes any number of functions and returns a new function that applies them <strong>right-to-left</strong>.<br><code>compose(f, g, h)(x)</code> should equal <code>f(g(h(x)))</code>.`,
    jsNote: `<strong>JS twist:</strong> <code>...fns</code> is the rest parameter — like Java varargs but it gives you a real array. Use <code>Array.prototype.reduceRight</code> for elegant right-to-left application.`,
    hint: `const compose = (...fns) => x => fns.reduceRight((v, f) => f(v), x);`,
    starter: `const compose = /* rest params + reduceRight */;`,
    tests: (fn) => {
      const add1 = x => x + 1;
      const double = x => x * 2;
      const square = x => x * x;
      const f = fn(add1, double, square); // add1(double(square(3))) = add1(double(9)) = add1(18) = 19
      if (f(3) !== 19) return `compose(add1,double,square)(3) → expected 19, got ${f(3)}`;
      const g = fn(double, add1); // double(add1(5)) = 12
      if (g(5) !== 12) return `compose(double,add1)(5) → expected 12, got ${g(5)}`;
      return true;
    }
  },
  {
    id: 6, diff: 3,
    title: "Recursive Countdown",
    tags: ["recursive"],
    xp: 120,
    desc: `Write a recursive function <code>countdown(n)</code> that returns an array <code>[n, n-1, ..., 1, 0]</code>. No loops. Base case: when <code>n < 0</code>, return <code>[]</code>.`,
    jsNote: `<strong>JS twist:</strong> Spread syntax <code>[n, ...countdown(n-1)]</code> lets you build arrays elegantly without <code>add()</code>. JavaScript does <em>not</em> have guaranteed TCO (tail-call optimisation) outside strict mode Safari — be aware for large n.`,
    hint: `function countdown(n) {\n  if (n < 0) return [];\n  return [n, ...countdown(n - 1)];\n}`,
    starter: `function countdown(n) {\n  // base case + recursive spread\n}`,
    tests: (fn) => {
      const r1 = JSON.stringify(fn(4));
      const r2 = JSON.stringify(fn(0));
      const r3 = JSON.stringify(fn(-1));
      if (r1 !== "[4,3,2,1,0]") return `countdown(4) → expected [4,3,2,1,0], got ${r1}`;
      if (r2 !== "[0]")         return `countdown(0) → expected [0], got ${r2}`;
      if (r3 !== "[]")          return `countdown(-1) → expected [], got ${r3}`;
      return true;
    }
  },
  {
    id: 7, diff: 3,
    title: "Recursive Deep Flatten",
    tags: ["recursive"],
    xp: 160,
    desc: `Write a recursive function <code>deepFlatten(arr)</code> that flattens a deeply nested array of numbers into a single flat array.<br><code>deepFlatten([1,[2,[3,[4]]],5])</code> → <code>[1,2,3,4,5]</code><br><br><em>Do not use <code>Array.flat()</code>.</em>`,
    jsNote: `<strong>JS twist:</strong> Use <code>Array.isArray(item)</code> to check if an element is a sub-array. Combine with spread: <code>[...result, ...deepFlatten(item)]</code>. In Java you'd need generics and explicit type checks.`,
    hint: `function deepFlatten(arr) {\n  return arr.reduce((acc, item) =>\n    Array.isArray(item) ? [...acc, ...deepFlatten(item)] : [...acc, item]\n  , []);\n}`,
    starter: `function deepFlatten(arr) {\n  // Array.isArray + reduce/spread\n}`,
    tests: (fn) => {
      const r1 = JSON.stringify(fn([1,[2,[3,[4]]],5]));
      const r2 = JSON.stringify(fn([[1,2],[3,[4,[5]]]]));
      const r3 = JSON.stringify(fn([1,2,3]));
      if (r1 !== "[1,2,3,4,5]")   return `Test 1 failed: expected [1,2,3,4,5], got ${r1}`;
      if (r2 !== "[1,2,3,4,5]")   return `Test 2 failed: expected [1,2,3,4,5], got ${r2}`;
      if (r3 !== "[1,2,3]")        return `Test 3 failed: expected [1,2,3], got ${r3}`;
      return true;
    }
  },
  {
    id: 8, diff: 4,
    title: "Memoized Fibonacci",
    tags: ["recursive"],
    xp: 200,
    desc: `Write a function <code>memoFib(n)</code> that returns the nth Fibonacci number using recursion with memoization. The cache must live in a closure — not a global variable. <code>memoFib(0)=0, memoFib(1)=1</code>.`,
    jsNote: `<strong>JS twist:</strong> Use an IIFE (Immediately Invoked Function Expression) to wrap the cache: <code>const memoFib = (() => { const cache = {}; return function fib(n) {...}; })();</code><br>This pattern is common in JS for module-like encapsulation without classes.`,
    hint: `const memoFib = (() => {\n  const cache = {};\n  return function fib(n) {\n    if (n <= 1) return n;\n    if (cache[n] !== undefined) return cache[n];\n    return cache[n] = fib(n-1) + fib(n-2);\n  };\n})();`,
    starter: `const memoFib = (() => {\n  // IIFE: cache + recursive function\n})();`,
    tests: (fn) => {
      const cases = [[0,0],[1,1],[6,8],[10,55],[15,610]];
      for (const [n, expected] of cases) {
        const got = fn(n);
        if (got !== expected) return `memoFib(${n}) → expected ${expected}, got ${got}`;
      }
      return true;
    }
  },
  {
    id: 9, diff: 4,
    title: "Recursive Tree Walker",
    tags: ["recursive"],
    xp: 220,
    desc: `Given a nested tree node <code>{ value, children: [] }</code>, write <code>sumTree(node)</code> that recursively sums all <code>value</code> fields in the entire tree.`,
    jsNote: `<strong>JS twist:</strong> Destructuring makes tree work elegant: <code>const { value, children } = node</code>. Combine with <code>.reduce()</code> over children for a very idiomatic JS solution — no temp variables needed.`,
    hint: `function sumTree({ value, children }) {\n  return value + children.reduce((sum, child) => sum + sumTree(child), 0);\n}`,
    starter: `function sumTree(node) {\n  // destructure + reduce over children\n}`,
    tests: (fn) => {
      const tree = {
        value: 1,
        children: [
          { value: 2, children: [
            { value: 4, children: [] },
            { value: 5, children: [] }
          ]},
          { value: 3, children: [
            { value: 6, children: [] }
          ]}
        ]
      };
      const r = fn(tree); // 1+2+3+4+5+6 = 21
      if (r !== 21) return `Expected 21, got ${r}`;
      const leaf = { value: 42, children: [] };
      if (fn(leaf) !== 42) return `Leaf node: expected 42, got ${fn(leaf)}`;
      return true;
    }
  },
  {
    id: 10, diff: 5,
    title: "Recursive Async Retry",
    tags: ["recursive"],
    xp: 300,
    desc: `Write a function <code>retry(fn, times)</code> that calls an async function <code>fn</code>. If it rejects, retry up to <code>times</code> total attempts. Return a <strong>Promise</strong> that resolves with the first success, or rejects with the last error if all attempts fail.<br><br>This must be recursive — no loops.`,
    jsNote: `<strong>JS twist:</strong> Promises and <code>async/await</code> are first-class. A recursive promise chain is idiomatic for retry logic. Use <code>.catch()</code> on the promise to recurse: <code>return fn().catch(err => times > 1 ? retry(fn, times - 1) : Promise.reject(err));</code>`,
    hint: `function retry(fn, times) {\n  return fn().catch(err =>\n    times > 1 ? retry(fn, times - 1) : Promise.reject(err)\n  );\n}`,
    starter: `function retry(fn, times) {\n  // return fn().catch(...recursive...)\n}`,
    tests: async (fn) => {
      // Test 1: succeeds on 3rd try
      let attempts = 0;
      const unstable = () => new Promise((res, rej) => {
        attempts++;
        attempts >= 3 ? res("ok") : rej(new Error("fail"));
      });
      const r1 = await fn(unstable, 5);
      if (r1 !== "ok") return `Expected "ok", got "${r1}"`;
      if (attempts !== 3) return `Expected 3 attempts, got ${attempts}`;

      // Test 2: always fails — should reject
      const alwaysFail = () => Promise.reject(new Error("boom"));
      try {
        await fn(alwaysFail, 3);
        return `Should have rejected but resolved`;
      } catch (e) {
        if (e.message !== "boom") return `Expected error "boom", got "${e.message}"`;
      }
      return true;
    }
  }
];

/* ── STATE ── */
let solved = new Set();
let totalXP = 0;
const BADGE_THRESHOLDS = { b1: 1, b3: 5, b10: 10 };

/* ── RENDER ── */
const main = document.getElementById("main");

exercises.forEach((ex, idx) => {
  const card = document.createElement("div");
  card.className = `card ${idx === 0 ? "active" : idx > 0 ? "" : "locked"}`;
  card.id = `card-${ex.id}`;

  const tagsHtml = ex.tags.map(t => `<span class="tag ${t}">${t}</span>`).join("");

  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(${ex.id})">
      <span class="card-num">#${String(ex.id).padStart(2,"0")}</span>
      <span class="card-title">${ex.title}<span class="status-icon"> ✓</span></span>
      <div class="card-tags">${tagsHtml}</div>
      <div class="diff-dot diff-${Math.ceil(ex.diff)}"></div>
      <span class="card-chevron">▶</span>
    </div>
    <div class="card-body">
      <p class="desc">${ex.desc}</p>
      <div class="js-note">${ex.jsNote}</div>
      <div class="editor-label">// your code</div>
      <textarea class="editor" id="editor-${ex.id}" spellcheck="false">${ex.starter}</textarea>
      <div class="btn-row">
        <button class="btn btn-run" onclick="runExercise(${ex.id})">▶ Run Tests</button>
        <button class="btn btn-hint" onclick="toggleHint(${ex.id})">💡 Hint</button>
        <button class="btn btn-reset" onclick="resetEditor(${ex.id})">↺ Reset</button>
      </div>
      <div class="hint-box" id="hint-${ex.id}"><pre>${ex.hint}</pre></div>
      <div class="output" id="output-${ex.id}"></div>
    </div>
  `;

  main.appendChild(card);
  if (idx === 0) toggleCard(1);
});

/* ── TOGGLE ── */
function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle("open");
}

function toggleHint(id) {
  document.getElementById(`hint-${id}`).classList.toggle("show");
}

function resetEditor(id) {
  const ex = exercises.find(e => e.id === id);
  document.getElementById(`editor-${id}`).value = ex.starter;
  const out = document.getElementById(`output-${id}`);
  out.className = "output";
  out.textContent = "";
}

/* ── RUN ── */
async function runExercise(id) {
  const ex = exercises.find(e => e.id === id);
  const code = document.getElementById(`editor-${id}`).value;
  const out  = document.getElementById(`output-${id}`);

  try {
    // Special handling for curry test (id 4)
    if (id === 4) {
      const fn = new Function(code + "\nreturn { multiply, triple, quadruple };");
      const { multiply, triple, quadruple } = fn();
      if (typeof triple !== "function") throw new Error("triple must be a function");
      if (typeof quadruple !== "function") throw new Error("quadruple must be a function");
      if (triple(4) !== 12)    throw new Error(`triple(4) → expected 12, got ${triple(4)}`);
      if (triple(7) !== 21)    throw new Error(`triple(7) → expected 21, got ${triple(7)}`);
      if (quadruple(3) !== 12) throw new Error(`quadruple(3) → expected 12, got ${quadruple(3)}`);
      if (multiply(5)(6) !== 30) throw new Error(`multiply(5)(6) → expected 30, got ${multiply(5)(6)}`);
      markSolved(id, ex.xp, out);
      return;
    }

    // Determine exported name
    const exportName = {
      1: "greet", 2: "evenSquares", 3: "makeCounter",
      5: "compose", 6: "countdown", 7: "deepFlatten",
      8: "memoFib", 9: "sumTree", 10: "retry"
    }[id];

    const fn = new Function(code + `\nreturn ${exportName};`)();

    const result = await ex.tests(fn);

    if (result === true) {
      markSolved(id, ex.xp, out);
    } else {
      out.className = "output fail";
      out.innerHTML = `✗ Test failed: ${result}`;
    }
  } catch (e) {
    out.className = "output fail";
    out.innerHTML = `✗ Error: ${e.message}`;
  }
}

function markSolved(id, xp, out) {
  const card = document.getElementById(`card-${id}`);
  if (!solved.has(id)) {
    solved.add(id);
    totalXP += xp;
    card.classList.add("just-solved");
    setTimeout(() => card.classList.remove("just-solved"), 700);
  }
  card.classList.add("solved");
  card.classList.remove("active");
  out.className = "output pass";
  out.innerHTML = `✓ All tests passed! +${xp} XP`;
  updateProgress();

  // unlock next
  const nextCard = document.getElementById(`card-${id + 1}`);
  if (nextCard) {
    nextCard.classList.remove("locked");
    nextCard.classList.add("active");
  }
}

function updateProgress() {
  const n = solved.size;
  document.getElementById("prog-label").textContent = `${n} / 10 solved`;
  document.getElementById("xp-label").textContent = `${totalXP} XP`;
  document.getElementById("prog-fill").style.width = `${n * 10}%`;
  document.getElementById("xp-total").textContent = `Total XP: ${totalXP} — ${getTitle(n)}`;

  // badges
  if (n >= 1)  document.getElementById("b1").classList.add("unlocked");
  if (n >= 5)  document.getElementById("b3").classList.add("unlocked");
  if (solved.has(6) || solved.has(7) || solved.has(8) || solved.has(9) || solved.has(10))
               document.getElementById("b5").classList.add("unlocked");
  if (n >= 10) document.getElementById("b10").classList.add("unlocked", "gold");
}

function getTitle(n) {
  if (n === 0)  return "Awaiting your first function...";
  if (n < 3)    return "Junior Dev";
  if (n < 5)    return "Apprentice";
  if (n < 7)    return "Engineer";
  if (n < 9)    return "Senior Dev";
  if (n < 10)   return "Principal Engineer";
  return "🏆 JavaScript Master";
}

// Tab support in editors
document.querySelectorAll('.editor').forEach(ed => {
  ed.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ed.selectionStart, end = ed.selectionEnd;
      ed.value = ed.value.substring(0, s) + '  ' + ed.value.substring(end);
      ed.selectionStart = ed.selectionEnd = s + 2;
    }
  });
});
</script>
