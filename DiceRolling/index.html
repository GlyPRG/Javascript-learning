<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="container">
    
    <h1>Dice Roller</h1>
    <label for="diceNumber">Amount: </label>
    <input type="number" name="diceNumber" id="input" value="1" min="1">
    <button id="submit" onclick="rollDices()">Roll Dices</button>
    
    <div id="result"> </div>
    <div id="dices"> </div>

  </div>

  <script src="dicerolling.js"></script>
</body>
</html>
